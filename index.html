<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedTheme = localStorage.getItem('color-scheme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = savedTheme;
        }
      } catch (e) {}
    </script>
    <title>Doboku Lab | 土木工学インタラクティブ学習ポータル</title>
    <meta
      name="description"
      content="日本の大学・高専の土木系学生向けインタラクティブ学習ポータル。土質力学（モールの応力円・ランキン土圧）、構造力学（SFD・BMD）、水理学（マニング公式）を図解と数式で直感的に学べます。"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cline x1='5' y1='16' x2='27' y2='16' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
