name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit tests (vitest)
        run: npm test

      - name: Type-check, build & prerender SEO/AEO bundle
        run: npm run build

      - name: Verify production artifacts, SEO/AEO & CSP safety
        run: |
          set -euo pipefail
          for f in \
            dist/index.html \
            dist/404.html \
            dist/_headers \
            dist/manifest.webmanifest \
            dist/sw.js \
            dist/registerSW.js \
            dist/robots.txt \
            dist/sitemap.xml \
            dist/llms.txt \
            dist/llms-full.txt \
            dist/og-image.png \
            dist/favicon.ico \
            dist/favicon.png \
            dist/favicon.svg \
            dist/icon-192.png \
            dist/icon-512.png \
            dist/legal/index.html \
            dist/subject/structural/index.html \
            dist/subject/hydraulics/index.html \
            dist/subject/soil/index.html \
            dist/subject/math-programming/index.html \
            dist/unit/geomechanics-continuum/index.html \
            dist/unit/mohr-circle/index.html \
            dist/unit/rankine-earth-pressure/index.html \
            dist/unit/beam-sfd-bmd/index.html \
            dist/unit/open-channel-flow/index.html \
            dist/unit/lp-optimization/index.html \
            dist/unit/nlp-optimization/index.html \
            dist/unit/geomechanics-continuum.md \
            dist/unit/mohr-circle.md \
            dist/unit/rankine-earth-pressure.md \
            dist/unit/beam-sfd-bmd.md \
            dist/unit/open-channel-flow.md \
            dist/unit/lp-optimization.md \
            dist/unit/nlp-optimization.md; do
            test -f "$f" || { echo "Missing required artifact: $f"; exit 1; }
          done

          # Ensure every <script> tag in all generated HTML files satisfies strict CSP (hash-checked inline scripts) & valid JSON-LD
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const headersText = fs.readFileSync("dist/_headers", "utf8");
            const cspMatch = headersText.match(/^\s*Content-Security-Policy:\s*(.+)$/im);
            if (!cspMatch) throw new Error("Missing Content-Security-Policy in dist/_headers");
            const cspValue = cspMatch[1];
            if (!/\bbase-uri\s+\x27none\x27/i.test(cspValue)) {
              throw new Error("Missing base-uri none in CSP");
            }
            if (!/\brequire-trusted-types-for\s+\x27script\x27/i.test(cspValue)) {
              throw new Error("Missing require-trusted-types-for script in CSP");
            }
            if (!/\btrusted-types\b[^;]*\bapp-jsonld\b[^;]*\bapp-sw\b/i.test(cspValue)) {
              throw new Error("Missing trusted-types app-jsonld app-sw in CSP");
            }
            const scriptSrcMatch = cspValue.match(/\bscript-src\s+([^;]+)/i);
            if (!scriptSrcMatch) throw new Error("Missing script-src in CSP");
            const allowedHashes = new Set();
            for (const m of scriptSrcMatch[1].matchAll(/\x27(sha256-[A-Za-z0-9+/=]+)\x27/g)) {
              allowedHashes.add(m[1]);
            }
            const regSw = fs.readFileSync("dist/registerSW.js", "utf8");
            if (!regSw.includes("app-sw") || !regSw.includes("createScriptURL")) {
              throw new Error("dist/registerSW.js must enforce Trusted Types policy app-sw");
            }
            const swText = fs.readFileSync("dist/sw.js", "utf8");
            if (
              !swText.includes("skipWaiting") ||
              !swText.includes("clientsClaim") ||
              !swText.includes("NetworkFirst") ||
              !swText.includes("html-pages-cache")
            ) {
              throw new Error("dist/sw.js must configure skipWaiting, clientsClaim, and NetworkFirst html-pages-cache");
            }
            if (
              swText.includes("createHandlerBoundToURL(\"index.html\")") ||
              swText.includes("createHandlerBoundToURL(\x27index.html\x27)")
            ) {
              throw new Error("dist/sw.js must not use Cache-First createHandlerBoundToURL(index.html)");
            }
            function walkHtml(dir) {
              const out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) out.push(...walkHtml(full));
                else if (entry.name.endsWith(".html")) out.push(full);
              }
              return out;
            }
            function scanScripts(html) {
              const lower = html.toLowerCase();
              const out = [];
              let pos = 0;
              while (pos < lower.length) {
                const start = lower.indexOf("<script", pos);
                if (start === -1) break;
                const ch = lower[start + 7];
                if (ch !== undefined && !/[\s>]/.test(ch)) {
                  pos = start + 7;
                  continue;
                }
                const openEnd = html.indexOf(">", start + 7);
                if (openEnd === -1) throw new Error("Unterminated <script>");
                let closeStart = lower.indexOf("</script", openEnd + 1);
                while (closeStart !== -1) {
                  const endCh = lower[closeStart + 8];
                  if (endCh === ">" || (endCh !== undefined && /\s/.test(endCh))) break;
                  closeStart = lower.indexOf("</script", closeStart + 8);
                }
                if (closeStart === -1) throw new Error("Missing </script>");
                const closeEnd = html.indexOf(">", closeStart + 8);
                if (closeEnd === -1) throw new Error("Unterminated </script>");
                out.push({ attrs: html.slice(start + 7, openEnd), body: html.slice(openEnd + 1, closeStart) });
                pos = closeEnd + 1;
              }
              return out;
            }
            const htmlFiles = walkHtml("dist");
            for (const file of htmlFiles) {
              const html = fs.readFileSync(file, "utf8");
              const isGscFile = path.basename(file) === "googlee9c930fab0503349.html";
              if (/<link\b[^>]*rel=["\x27]stylesheet["\x27]/i.test(html)) {
                console.error("Render-blocking external stylesheet link remains in", file);
                process.exit(1);
              }
              if (!isGscFile && !/<style\b[^>]*id=["\x27]app-styles["\x27]/i.test(html)) {
                console.error("Missing inlined <style id=app-styles> in", file);
                process.exit(1);
              }
              if (path.normalize(file) === path.normalize("dist/index.html")) {
                if (!html.includes("data-ssr-path=\"/\"") || !html.includes("app-notice-banner")) {
                  console.error("dist/index.html is missing SSR prerender markers");
                  process.exit(1);
                }
              }
              for (const [rawUrl] of html.matchAll(/\bhttps?:\/\/[^\s"\x27<>]+/gi)) {
                let parsedHost = "";
                try {
                  parsedHost = new URL(rawUrl).hostname.toLowerCase();
                } catch {
                  continue;
                }
                if (parsedHost === "fonts.googleapis.com" || parsedHost === "fonts.gstatic.com") {
                  console.error("External Google Fonts reference found in", file);
                  process.exit(1);
                }
              }
              for (const { attrs, body } of scanScripts(html)) {
                const hasSrc = /\bsrc\s*=/.test(attrs);
                const isJsonLd = /type\s*=\s*["\x27]application\/ld\+json["\x27]/i.test(attrs);
                if (hasSrc && /registerSW\.js/i.test(attrs) && !/\bdefer\b/i.test(attrs)) {
                  console.error("Render-blocking registerSW.js without defer in", file);
                  process.exit(1);
                }
                if (!hasSrc && !isJsonLd) {
                  const digest = "sha256-" + crypto.createHash("sha256").update(body, "utf8").digest("base64");
                  if (!allowedHashes.has(digest)) {
                    console.error("Inline executable <script> violates strict CSP in", file, digest, attrs);
                    process.exit(1);
                  }
                }
                if (isJsonLd) {
                  JSON.parse(body);
                }
              }
            }
            console.log("Verified strict CSP & valid JSON-LD across", htmlFiles.length, "HTML files");
          '

      - name: Check bundle & SW precache size budgets
        run: npm run check:budgets

      - name: Install Playwright Chromium for E2E & Accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & axe-core WCAG 2.2 AA tests
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-bundle
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-bundle
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Deploy with Wrangler (if Cloudflare secrets are configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured; skipping Wrangler deploy step."
            exit 0
          fi
          npx --yes wrangler@4 deploy
